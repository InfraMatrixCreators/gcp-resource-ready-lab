name: GCP Terraform CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  gcp-auth-test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/346137993404/locations/global/workloadIdentityPools/github-actions-pool-01/providers/github-actions-provider'
          service_account: 'github-actions-sa@jitu-dev-project-2026.iam.gserviceaccount.com'

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false

      - name: Check Terraform
        run: |
          Write-Host "===== Terraform Location ====="
          where.exe terraform

          Write-Host "===== Terraform Version ====="
          terraform version

      - name: Terraform Init
        working-directory: ./Fed-deploy/Environment/Uat
        run: terraform init -input=false -no-color

      - name: Terraform Validate
        working-directory: ./Fed-deploy/Environment/Uat
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: ./Fed-deploy/Environment/Uat
        run: terraform plan -input=false -no-color