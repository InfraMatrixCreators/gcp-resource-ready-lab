
name: GCP Terraform CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/346137993404/locations/global/workloadIdentityPools/github-actions-pool-01/providers/github-actions-provider"
          service_account: "github-actions-sa@jitu-dev-project-2026.iam.gserviceaccount.com"
          project_id: "jitu-dev-project-2026"

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Verify GCP Authentication
        run: |
          Write-Host "===== Active GCP Account ====="
          gcloud auth list

          Write-Host "===== Current GCP Project ====="
          gcloud config get-value project

          Write-Host "===== GCP Project Test ====="
          gcloud projects describe jitu-dev-project-2026 --format="value(projectId)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform
        run: |
          Write-Host "===== Terraform Location ====="
          where.exe terraform

          Write-Host "===== Terraform Version ====="
          terraform version

      - name: Terraform Init
        working-directory: ./Fed-deploy/Environment/Uat
        run: terraform init 

      - name: Terraform Validate
        working-directory: ./Fed-deploy/Environment/Uat
        run: terraform validate 

      - name: Terraform Plan
        working-directory: ./Fed-deploy/Environment/Uat
        run: terraform plan 

      - name: Terraform Destroy
        working-directory: ./Fed-deploy/Environment/Uat
        run: terraform destroy -auto-approve
        
        
